// Примерные цены по магазинам: базовая цена × уровень цен сети × небольшой разброс по товару
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
const P={};
for(const[id,a]of Object.entries(PR)){
  P[id]={n:a[0],u:a[1],pack:a[2],pl:a[3],pantry:!!a[5],p:STORES.map(s=>{
    const v=a[4]*s.f*(0.94+hash(id+s.id)*0.12);return Math.max(19,Math.round(v/10)*10-1)})};
}
const D=DL.map(([id,n,cuisine,type,t,i])=>({id,n,cuisine,type,t,i}));

// Города. Цены в каждом городе свои; магазин, которого в городе нет, можно скрыть.
const CITIES=[
  {id:'moscow',name:'Москва',inn:'Москве'},
  {id:'khimki',name:'Химки',inn:'Химках'},
  {id:'tver',name:'Тверь',inn:'Твери'},
  {id:'konakovo',name:'Конаково',inn:'Конакове'}];

// Проверенные цены из prices.json: REAL.cities[город][магазин][продукт] = {price, size, date, src}.
// size — размер упаковки, к которой относится цена (в единицах продукта); пересчитываем на нашу упаковку.
let REAL={cities:{}};

const KEY='chto-gotovim-v3';
let S={city:null,dish:null,vp:{},got:{},sel:{},done:{},pantryBuy:{},prices:{},hidden:{},tab:'dishes',cat:'Все',f:'',mode:'split',store:'p5',q:'',dq:''};
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s)S=Object.assign(S,s);
  else{
    // перенос из v2: ручные правки цен были общими — относим их к Москве
    const o=JSON.parse(localStorage.getItem('chto-gotovim-v2')||'null');
    if(o){Object.assign(S,o);S.prices=Object.keys(o.prices||{}).length?{moscow:o.prices}:{};S.hidden={};S.city=null;S.started=1}
    else{const o1=JSON.parse(localStorage.getItem('chto-gotovim-v1')||'null');if(o1){S.sel=o1.sel||{};S.started=1}}
  }
}catch(e){}
for(const k in S.sel)if(!D.some(d=>d.id===k))delete S.sel[k];
if(!['Все',...D.map(d=>d.cuisine)].includes(S.cat))S.cat='Все';
if(S.city&&!CITIES.some(c=>c.id===S.city))S.city=null;
// открытое блюдо берём из адреса (#borsch), чтобы работали ссылка и кнопка «Назад»
S.dish=D.some(d=>d.id===location.hash.slice(1))?location.hash.slice(1):null;if(S.dish)S.tab='dishes';
S.vp=S.vp||{};S.got=S.got||{};
// пример на первом запуске
if(!Object.keys(S.sel).length&&!S.started){S.sel={borsch:4,syrniki:4};S.started=1}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const city=()=>CITIES.find(c=>c.id===S.city)||CITIES[0];

// Магазины, которые есть в выбранном городе (индексы в STORES)
const act=()=>{const h=S.hidden[S.city]||{};const a=STORES.map((s,i)=>i).filter(i=>!h[STORES[i].id]);return a.length?a:[0]};
// Откуда цена: 'own' — поправил сам, 'real' — проверенная из prices.json, 'est' — примерная
function priceInfo(pid,si){
  const k=STORES[si].id;
  const o=((S.prices[S.city]||{})[pid]||{})[k];
  if(o!=null)return{v:o,kind:'own'};
  const r=(((REAL.cities[S.city]||{})[k])||{})[pid];
  if(r&&r.price>0){const size=r.size||P[pid].pack;return{v:Math.round(r.price/size*P[pid].pack),kind:'real',date:r.date,src:r.src,raw:r}}
  return{v:P[pid].p[si],kind:'est'};
}
const price=(pid,si)=>priceInfo(pid,si).v;
const minAct=(f)=>{const a=act();let bi=a[0];for(const i of a)if(f(i)<f(bi))bi=i;return bi};
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const amt=(v,u)=>u==='г'&&v>=1000?(+(v/1000).toFixed(2)).toString().replace('.',',')+' кг':u==='мл'&&v>=1000?(+(v/1000).toFixed(2)).toString().replace('.',',')+' л':Math.round(v)+' '+u;
const packs=(need,pack)=>Math.max(1,Math.ceil(need/pack-0.1));
const portions=n=>n+' '+(n%10===1&&n%100!==11?'порция':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'порции':'порций');

function needs(){
  const m={};
  for(const d of D){const k=S.sel[d.id];if(!k)continue;
    for(const[pid,v]of Object.entries(d.i)){(m[pid]=m[pid]||{need:0,from:[]});m[pid].need+=v*k/4;m[pid].from.push(d.n)}}
  return Object.entries(m).map(([pid,o])=>{const pr=P[pid];const n=packs(o.need,pr.pack);
    const costs=STORES.map((s,i)=>price(pid,i)*n);const best=minAct(i=>costs[i]);
    return {pid,pr,need:o.need,from:o.from,n,costs,best,min:costs[best],pantry:!!pr.pantry&&!S.pantryBuy[pid]}});
}
function dishCost(d,k){let s=0;for(const[pid,v]of Object.entries(d.i)){if(P[pid].pantry)continue;const n=v*k/4/P[pid].pack;s+=price(pid,minAct(i=>price(pid,i)))*n}return s}

function summary(list){
  const buy=list.filter(x=>!x.pantry);
  const per=STORES.map((s,i)=>buy.reduce((a,x)=>a+x.costs[i],0));
  const split=buy.reduce((a,x)=>a+x.min,0);
  // сколько цен в корзине проверены (по магазину, где берём товар)
  const real=buy.filter(x=>priceInfo(x.pid,x.best).kind!=='est').length;
  return{buy,per,split,bestOne:minAct(i=>per[i]),real};
}

const V=document.getElementById('view');
function render(){
  document.getElementById('hcity').textContent=S.city?city().name:'Выбрать город';
  if(!S.city||S.tab==='city'){
    document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-current','false'));
    V.innerHTML=vCity();document.getElementById('htotal').closest('.pill').hidden=true;save();return;
  }
  document.getElementById('htotal').closest('.pill').hidden=false;
  if(!act().includes(STORES.findIndex(s=>s.id===S.store)))S.store=STORES[act()[0]].id;
  const list=needs(),sm=summary(list);
  const cnt=Object.keys(S.sel).length;
  document.getElementById('htotal').textContent=rub(S.mode==='split'?sm.split:sm.per[STORES.findIndex(s=>s.id===S.store)]);
  document.getElementById('hsub').textContent=cnt?`${cnt} ${cnt===1?'блюдо':cnt<5?'блюда':'блюд'} · ${sm.buy.length} продуктов к покупке`:'Выбери блюда — список покупок соберётся сам';
  const b=document.getElementById('badge');b.hidden=!sm.buy.length;b.textContent=sm.buy.filter(x=>!S.done[x.pid]).length;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-current',x.dataset.tab===S.tab?'page':'false'));
  V.innerHTML=S.tab==='dishes'?(S.dish?vDish(S.dish):vDishes()):S.tab==='cart'?vCart(list,sm):vPrices();
  POP=null;
  save();
}

// Минуты из строки времени: «25 мин», «1 ч 10 мин», «1,5 ч», «30 мин + ночь» (берём первую часть)
function mins(t){const s=t.split('+')[0];const h=s.match(/([\d,]+)\s*ч/);const m=s.match(/(\d+)\s*мин/);return (h?parseFloat(h[1].replace(',','.'))*60:0)+(m?+m[1]:0)}
// Кухни с фото-«аватаркой»: блюдо, по которому кухню узнают сразу
const CUISINE_PIC={'Итальянская':'margherita','Русская':'bliny','Белорусская':'draniki','Украинская':'borsch','Французская':'ratatouille','Азиатская':'ramen'};
let POP=null; // блюдо, которое только что добавили: его кнопка «+» коротко подпрыгнет

function card(d){
  const on=!!S.sel[d.id];
  return `<article class="dish">
    <button class="dish-open" data-open="${d.id}" aria-label="${d.n}, открыть рецепт">
      <span class="dish-photo"><img src="img/${d.id}.jpg" alt="" loading="lazy" width="640" height="640" onerror="this.style.visibility='hidden'"><span class="time">${d.t}</span></span>
      <span class="dname">${d.n}</span>
      <span class="dmeta">${d.cuisine.replace(/ая$/,'ая кухня')}</span>
    </button>
    <button class="quick ${on?'on':''} ${POP===d.id?'pop':''}" data-toggle="${d.id}" aria-pressed="${on}" aria-label="${on?'Убрать из списка покупок':'Добавить продукты в список покупок'}">${on?S.sel[d.id]+' п.':'+'}</button>
  </article>`;
}

function hello(){const h=new Date().getHours();return h<11?'Что на завтрак?':h<16?'Что на обед?':'Что на ужин?'}

// Быстрые фильтры. «Без мяса» — без мяса, птицы и рыбы; яйца и молочное можно.
const MEATY=new Set(['beef','pork','lamb','fillet','thighs','mince','beefmince','liver','knuckle','ribs','salo','bacon','pepperoni','ham','sausage','sausages','steak','duck','chicken','salmon','whitefish','shrimp','herring','tuna','crab','mussels','fishsauce','oyster']);
const FILTERS={fast:['До 30 минут',d=>mins(d.t)<=30],veg:['Без мяса',d=>!Object.keys(d.i).some(p=>MEATY.has(p))],soup:['Супы',d=>d.type==='Суп'],sweet:['Сладкое',d=>d.type==='Десерт'||(d.type==='Выпечка'&&'sugar' in d.i)]};
// Блюдо дня одно на всех в этот день; «Удиви меня» выбирает случайное из того, что сейчас на экране
const dayDish=()=>{let h=0;for(const c of new Date().toDateString())h=(h*31+c.charCodeAt(0))>>>0;return D[h%D.length]};
let PICK=null;
function todayCard(d){
  return `<section class="today" aria-label="${PICK?'Случайное блюдо':'Блюдо дня'}">
    <button class="today-open" data-open="${d.id}">
      <img src="img/${d.id}.jpg" alt="" width="640" height="640" onerror="this.style.visibility='hidden'">
      <span class="today-tag">${PICK?'Выпало сегодня':'Блюдо дня'}</span>
      <span class="today-text"><b>${d.n}</b><span>${d.t} · ${d.cuisine.replace(/ая$/,'ая кухня')} · продукты от ${rub(dishCost(d,4))}</span></span>
    </button>
    <button class="shuffle" data-shuffle><span class="die" aria-hidden="true"><i></i><i></i><i></i></span>Удиви меня</button>
  </section>`;
}
function dishList(){
  const dq=S.dq.trim().toLowerCase();const f=FILTERS[S.f];
  return D.filter(d=>(S.cat==='Все'||d.cuisine===S.cat)&&(!f||f[1](d))&&(!dq||d.n.toLowerCase().includes(dq)||d.type.toLowerCase().includes(dq)||d.cuisine.toLowerCase().includes(dq)));
}
// Кубик: несколько фото быстро сменяют друг друга и замедляются, как барабан
function shuffle(){
  const pool=dishList().length?dishList():D;const box=document.querySelector('.today');if(!box||box.classList.contains('spin'))return;
  const seq=Array.from({length:9},()=>pool[Math.floor(Math.random()*pool.length)]);
  if(pool.length>1)while(seq[8].id===(PICK||dayDish().id))seq[8]=pool[Math.floor(Math.random()*pool.length)];
  seq.forEach(d=>{new Image().src=`img/${d.id}.jpg`});
  box.classList.add('spin');
  const img=box.querySelector('img'),name=box.querySelector('.today-text b'),meta=box.querySelector('.today-text span'),tag=box.querySelector('.today-tag');
  let i=0;const step=()=>{const d=seq[i];img.src=`img/${d.id}.jpg`;name.textContent=d.n;meta.textContent=d.t+' · '+d.cuisine.replace(/ая$/,'ая кухня');tag.textContent='Выбираю…';
    if(++i<seq.length)setTimeout(step,70+i*i*6);else setTimeout(()=>{PICK=d.id;render()},380)};
  step();
}

function vDishes(){
  const cats=['Все',...new Set(D.map(d=>d.cuisine))];
  const dq=S.dq.trim().toLowerCase();

  const soups=D.filter(d=>d.type==='Суп');
  const tea=D.filter(d=>['Десерт','Завтрак'].includes(d.type));
  return `<p class="hello">${hello()}</p>

  <div class="cuisines">${cats.map(c=>`<button class="cuisine" data-cat="${c}" aria-pressed="${S.cat===c}">${c==='Все'?'<span class="all">✦</span>Все':`<img src="img/${CUISINE_PIC[c]}.jpg" alt="" loading="lazy">${c}`}</button>`).join('')}</div>

  ${browsing?shelf('Ужин за полчаса',quick)+shelf('Супы',soups)+shelf('На завтрак и к чаю',tea):''}
  ${ds.length?`<section class="shelf"><div class="shelf-head"><h2>${browsing?'Все блюда':dq?`Нашлось: ${ds.length}`:[S.cat==='Все'?'':S.cat+' кухня',S.f?FILTERS[S.f][0].toLowerCase():''].filter(Boolean).join(', ').replace(/^./,c=>c.toUpperCase())}</h2><span class="muted">${ds.length}</span></div><div class="grid">${ds.map(card).join('')}</div></section>`
    :`<div class="empty"><h2>Такого блюда нет</h2><p>Попробуйте другое слово, снимите фильтр или выберите «Все».</p></div>`}
  <p class="note">Нажмите «+» на фото, и продукты для блюда попадут в список покупок, на 4 порции. Соль, сахар, перец, лавровый лист и подсолнечное масло считаются как «есть дома».</p>
  ${installNote()}`;

// Страница блюда: фото во всю ширину, рецепт «наплывает» на него снизу.
let CREDITS={};
function vDish(id){
  const d=D.find(x=>x.id===id);if(!d)return vDishes();

  const k=inCart?S.sel[id]:(S.vp[id]||4);

  const smart=window.smartSteps?smartSteps(d,k,steps):steps.map(html=>({html,used:[]}));
  const got=S.got[id]||{};
  const ings=Object.entries(d.i).map(([pid,v])=>{const pr=P[pid];const need=v*k/4;
    const show=pr.u==='шт'&&!['eggs','lemon','lime','avocado'].includes(pid)?Math.max(1,Math.round(need*10)/10)+' '+(pid==='nori'?'листа':'шт'):amt(need,pr.u);
    return `<label class="ing"><input type="checkbox" data-got="${id}:${pid}" ${got[pid]?'checked':''}><span>${pr.n}${pr.pantry?'<span class="home">обычно есть дома</span>':''}</span><b>${show}</b></label>`}).join('');

  return `<div class="dish-page">
    <div class="hero"><img src="img/${d.id}.jpg" alt="${d.n}" width="640" height="480" onerror="this.style.visibility='hidden'"><button class="page-back" data-back aria-label="Назад к блюдам">‹</button></div>
    <div class="sheet">
      <h2 class="recipe-title">${d.n}</h2>
      <div class="facts"><span>${d.t}</span><span>${d.cuisine.replace(/ая$/,'ая кухня')}</span><span>${d.type}</span><span>продукты от ${rub(dishCost(d,k))}</span></div>
      <section class="panel"><div class="panel-head"><h2>Продукты</h2>
        <div class="stepper"><button data-pdec="${id}" aria-label="Меньше порций">−</button><span>${portions(k)}</span><button data-pinc="${id}" aria-label="Больше порций">+</button></div></div>${ings}</section>
      <div class="steps-head"><h2>Как готовить</h2><span class="muted">${steps.length} ${steps.length<5?'шага':'шагов'}</span></div>

      <ol class="steps">${smart.map((s,i)=>`<li data-step="${id}:${i}" class="${(STEPDONE[id]||{})[i]?'done':''}"><span>${s.html}</span></li>`).join('')}</ol>
      ${steps.length?`<p class="steps-hint">Граммы в шагах посчитаны на ${portions(k)}. Нажмите на шаг, когда сделаете его, а на ⏱ — чтобы засечь время.</p>`:''}
      <div class="sticky-buy">

      </div>

    </div>
  </div>`;
}

// Отмеченные шаги живут, пока открыта вкладка: на следующий раз рецепт снова чистый
const STEPDONE={};

// Режим «Готовлю»: экран 0 — собрать продукты, дальше по шагу на экран, в конце — «Приятного аппетита»
let COOK=null;
const cookEl=document.createElement('div');cookEl.className='cook';cookEl.hidden=true;
cookEl.setAttribute('role','dialog');cookEl.setAttribute('aria-modal','true');cookEl.setAttribute('aria-label','Готовлю по шагам');
document.body.append(cookEl);
function cookK(id){return S.sel[id]||S.vp[id]||4}
function vCook(){
  const d=D.find(x=>x.id===COOK.id),k=cookK(d.id),st=smartSteps(d,k,RECIPES[d.id]||[]),n=st.length,i=COOK.i;
  const top=`<div class="cook-top"><button class="cook-x" data-cookclose aria-label="Закрыть">✕</button><span class="cook-name">${d.n}<small>${portions(k)}</small></span><span class="cook-count">${i===0?'Продукты':i>n?'Готово':`${i} / ${n}`}</span></div>
    <div class="cook-progress"><i style="width:${(Math.min(i,n)/n*100).toFixed(1)}%"></i></div>`;
  let body;
  if(i===0){const got=S.got[d.id]||{};
    body=`<div class="cook-num">Сначала соберите всё на столе</div><div class="cook-ings">${Object.entries(d.i).map(([pid])=>`<label class="ing"><input type="checkbox" data-got="${d.id}:${pid}" ${got[pid]?'checked':''}><span>${P[pid].n}</span><b>${amountOf(pid,k)}</b></label>`).join('')}</div>`}
  else if(i>n)body=`<div class="cook-final"><img src="img/${d.id}.jpg" alt=""><div class="cook-num">Все ${n} ${n<5?'шага':'шагов'} позади</div><p class="cook-text">Приятного аппетита!</p></div>`;
  else body=`<div class="cook-num">Шаг ${i}</div><p class="cook-text">${st[i-1].html}</p>${i<n?`<p class="cook-next"><span>Дальше:</span> ${RECIPES[d.id][i].replace(/^(.{90}).+$/,'$1…')}</p>`:''}`;
  return top+`<div class="cook-body" aria-live="polite"${i>0&&i<=n?` data-n="${i}"`:''}>${body}</div>
    <div class="cook-nav">${i>0&&i<=n?`<button class="ghost" data-cookgo="-1">‹ Назад</button>`:'<span></span>'}<button class="add" data-cookgo="${i>n?'close':1}">${i===0?'Начать готовить':i===n?'Готово!':i>n?'Закрыть':'Дальше ›'}</button></div>`;
}
function renderCook(){cookEl.innerHTML=vCook();cookEl.querySelector('.cook-body').scrollTop=0}
function openCook(id){COOK={id,i:0};cookEl.hidden=false;document.body.classList.add('cooking');renderCook();keepAwake(true);cookEl.querySelector('[data-cookgo]').focus()}
function closeCook(){COOK=null;cookEl.hidden=true;document.body.classList.remove('cooking');keepAwake(false);render()}
function cookGo(st){const n=(RECIPES[COOK.id]||[]).length;COOK.i=Math.max(0,Math.min(n+1,COOK.i+st));renderCook()}
document.addEventListener('keydown',e=>{if(!COOK)return;if(e.key==='Escape')closeCook();else if(e.key==='ArrowRight')cookGo(1);else if(e.key==='ArrowLeft')cookGo(-1)});
// Свайп влево и вправо листает шаги, руки могут быть в муке
let TX=null;
cookEl.addEventListener('touchstart',e=>{TX=e.touches[0].clientX},{passive:true});
cookEl.addEventListener('touchend',e=>{if(TX===null)return;const dx=e.changedTouches[0].clientX-TX;TX=null;if(Math.abs(dx)>70&&COOK.i>0)cookGo(dx<0?1:-1)},{passive:true});
// Когда экран снова виден, Wake Lock надо попросить ещё раз
document.addEventListener('visibilitychange',()=>{if(COOK&&document.visibilityState==='visible')keepAwake(true)});

// Всплывашка «Добавлено · Отменить»
let TOAST=null;
function toast(msg,undo){
  document.querySelector('.toast')?.remove();clearTimeout(TOAST);
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${msg}</span>${undo?'<button>Отменить</button>':''}`;
  if(undo)t.querySelector('button').onclick=()=>{t.remove();undo()};
  document.body.append(t);TOAST=setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},3600);
}
function toggleDish(id,k){
  const name=D.find(d=>d.id===id).n;
  if(S.sel[id]){const was=S.sel[id];delete S.sel[id];toast(`«${name}» убрано из списка`,()=>{S.sel[id]=was;render()})}
  else{S.sel[id]=k;POP=id;toast(`«${name}» в списке покупок`,()=>{delete S.sel[id];render()})}
}

// Фото на странице блюда чуть уезжает при прокрутке, как будто лежит под рецептом
addEventListener('scroll',()=>{const h=document.querySelector('.hero img');if(h&&!matchMedia('(prefers-reduced-motion: reduce)').matches)h.style.translate=`0 ${Math.min(scrollY,600)*0.35}px`},{passive:true});

addEventListener('popstate',()=>{const id=location.hash.slice(1);S.dish=D.some(d=>d.id===id)?id:null;render()});

    <p class="note">Цены для города ${city().name}: проверено ${sm.real} из ${sm.buy.length}, остальные примерные. Свои цены можно поправить на вкладке «Цены».</p>

function vPrices(){
  const q=S.q.trim().toLowerCase();

  const A=act(),h=S.hidden[S.city]||{};
  const real=Object.keys(P).reduce((n,id)=>n+A.filter(i=>priceInfo(id,i).kind==='real').length,0);
  const dates=[];for(const st of Object.values(REAL.cities[S.city]||{}))for(const r of Object.values(st))if(r.date)dates.push(r.date);
  const last=dates.sort().pop();
  return `<h2>Цены в городе ${city().name}</h2>
  <div class="label" style="margin-bottom:6px">Какие магазины есть в городе</div>
  <div class="storetoggles">${STORES.map(s=>`<button class="chip" data-togglestore="${s.id}" aria-pressed="${!h[s.id]}"><span class="dot" style="background:var(${s.c})"></span>${s.name}</button>`).join('')}</div>
  <p class="legend"><span><i style="border-color:var(--good)"></i>проверенная</span><span><i style="border-color:var(--s3)"></i>поправил сам</span><span><i style="border-color:var(--line)"></i><em>примерная</em></span></p>
  <p class="note" style="margin-bottom:12px">Проверено цен: ${real}${last?`, последнее обновление ${new Date(last).toLocaleDateString('ru-RU')}`:''}. Нажми на магазин выше, если его нет в твоём городе: он не будет участвовать в подсчёте.</p>
  <input class="search" id="q" type="search" placeholder="Найти продукт" value="${S.q.replace(/"/g,'&quot;')}">
  <div class="ptable-wrap"><table><thead><tr><th>Продукт</th>${A.map(i=>STORES[i]).map(s=>`<th><span class="dot" style="background:var(${s.c})"></span>${s.name}</th>`).join('')}</tr></thead><tbody>
  ${ids.map(id=>{const info=A.map(i=>priceInfo(id,i));const mn=Math.min(...info.map(x=>x.v));
    return `<tr><td>${P[id].n}<div class="q muted" style="font-weight:400;font-size:12px">за ${P[id].pl}</div></td>${info.map((x,j)=>{const i=A[j];
      const tip=x.kind==='real'?`проверено ${new Date(x.date).toLocaleDateString('ru-RU')}${x.src?', '+x.src:''}`:x.kind==='own'?'твоя цена':'примерная цена';
      return `<td><input id="p-${id}-${i}" inputmode="decimal" data-price="${id}" data-si="${i}" value="${x.v}" class="${x.v===mn?'min ':''}${x.kind}" title="${tip}" aria-label="${P[id].n}, ${STORES[i].name}, ${tip}"></td>`}).join('')}</tr>`}).join('')}
  </tbody></table></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="ghost danger" data-resetprices>Убрать мои правки цен в этом городе</button></div>
  <p class="note" style="margin-top:12px">Зелёной заливкой отмечена самая низкая цена. Твои правки сохраняются на этом телефоне и только для выбранного города.</p>`;
}

function vCity(){
  return `<h2>${S.city?'Сменить город':'Где ты покупаешь продукты?'}</h2>
  <p class="muted" style="margin-top:-6px">Цены в магазинах разных городов отличаются. Город можно поменять в любой момент, нажав на него в шапке.</p>
  <div class="cities">${CITIES.map(c=>{const n=Object.values(REAL.cities[c.id]||{}).reduce((a,st)=>a+Object.keys(st).length,0);
    return `<button data-setcity="${c.id}" aria-pressed="${S.city===c.id}">${c.name}<small>${n?`проверено цен: ${n}`:'пока примерные цены'}</small></button>`}).join('')}</div>`;
}

function installNote(){
  return `<details class="note" style="margin-top:12px"><summary style="font-weight:700;color:var(--fg)">Как добавить на экран «Домой»</summary>
  <p><b>iPhone (Safari):</b> кнопка «Поделиться» → «На экран „Домой“».<br><b>Android (Chrome):</b> меню ⋮ → «Добавить на главный экран» или «Установить приложение».</p></details>`;
}

document.addEventListener('click',e=>{
  const li=e.target.closest('li[data-step]');
  if(li&&!e.target.closest('button')){const [id,i]=li.dataset.step.split(':');const m=(STEPDONE[id]=STEPDONE[id]||{});m[i]=!m[i];li.classList.toggle('done',!!m[i]);return}
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.timer){startTimer(+d.timer,d.tlabel);return}
  if(d.cook){openCook(d.cook);return}
  if(d.cookgo){d.cookgo==='close'?closeCook():cookGo(+d.cookgo);return}
  if('cookclose' in d){closeCook();return}
  if('shuffle' in d){shuffle();return}
  if(d.tab){if(S.dish){S.dish=null;history.replaceState(null,'',location.pathname+location.search)}S.tab=d.tab;window.scrollTo(0,0)}
  else if(d.open){openDish(d.open);return}
  else if('back' in d){history.length>1&&location.hash?history.back():(S.dish=null,render());return}
  else if(d.pinc||d.pdec){const id=d.pinc||d.pdec,st=d.pinc?1:-1;if(S.sel[id])S.sel[id]=Math.max(1,Math.min(20,S.sel[id]+st));else S.vp[id]=Math.max(1,Math.min(20,(S.vp[id]||4)+st))}
  else if(d.buy){toggleDish(d.buy,S.vp[d.buy]||4)}
  else if(d.goto){S.tab=d.goto}
  else if(d.cat){S.cat=d.cat}
  else if(d.filter){S.f=S.f===d.filter?'':d.filter}
  else if(d.toggle){toggleDish(d.toggle,4)}
  else if(d.inc){S.sel[d.inc]=Math.min(20,S.sel[d.inc]+1)}
  else if(d.dec){S.sel[d.dec]-=1;if(S.sel[d.dec]<1)delete S.sel[d.dec]}
  else if(d.mode){S.mode=d.mode}
  else if(d.store){S.store=d.store}
  else if('uncheck' in d){S.done={}}
  else if('clear' in d){S.sel={};S.done={};S.pantryBuy={}}
  else if('resetprices' in d){delete S.prices[S.city]}
  else if('pickcity' in d){S.tab='city';window.scrollTo(0,0)}
  else if(d.setcity){S.city=d.setcity;S.tab='dishes';window.scrollTo(0,0)}
  else if(d.togglestore){const h=(S.hidden[S.city]=S.hidden[S.city]||{});
    if(h[d.togglestore])delete h[d.togglestore];
    else if(act().length>1)h[d.togglestore]=1;}
  else return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.got){const [di,pi]=d.got.split(':');const g=(S.got[di]=S.got[di]||{});if(t.checked)g[pi]=1;else delete g[pi];save()}
  else if(d.done){if(t.checked)S.done[d.done]=1;else delete S.done[d.done];render()}
  else if(d.pantry){if(t.checked)S.pantryBuy[d.pantry]=1;else delete S.pantryBuy[d.pantry];render()}
  else if(d.price){const v=parseFloat(String(t.value).replace(',','.'));
    if(!isNaN(v)&&v>=0){const c=(S.prices[S.city]=S.prices[S.city]||{});(c[d.price]=c[d.price]||{})[STORES[d.si].id]=v}render()}
});
document.addEventListener('input',e=>{
  const fid=e.target.id;if(fid==='q'||fid==='dq'){S[fid]=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById(fid);q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
render();
// Проверенные цены лежат рядом в prices.json; без сети берутся из кэша, а если файла нет — остаются примерные.
fetch('photos.json').then(r=>r.ok?r.json():null).then(j=>{if(j){CREDITS=j;if(S.dish)render()}}).catch(()=>{});
fetch('prices.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.cities){REAL=j;render()}}).catch(()=>{});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>

</body>
</html>
