<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Натали — цветочная мастерская в Химках</title>
    <meta name="description" content="Авторские букеты под ваш повод, бюджет и палитру. Фото перед отправкой, доставка по Москве и области, предзаказ без предоплаты." />
    <meta name="theme-color" content="#f1eff4" />
    <link rel="icon" href="./img/lily.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- DEMO BANNER: portfolio notice, keep on every demo page -->
    <script>
    (() => {
      const host = document.createElement('div');
      const root = host.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          :host{ all:initial }
          .wrap{ position:fixed; right:0; top:30%; z-index:2147483647; display:flex; align-items:flex-start; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; cursor:auto }
          .tab{ all:unset; box-sizing:border-box; width:28px; padding:12px 0; cursor:pointer; display:flex; align-items:center; justify-content:center;
            background:#ffd400; color:#111; border:2px solid #111; border-right:0; border-radius:8px 0 0 8px; box-shadow:-4px 4px 14px rgba(0,0,0,.28) }
          .tab span{ writing-mode:vertical-rl; transform:rotate(180deg); font-weight:900; font-size:16px; letter-spacing:.22em; line-height:1 }
          .tab:focus-visible{ outline:3px solid #111; outline-offset:2px }
          .panel{ display:none; width:230px; margin-right:-2px; padding:14px 16px; background:#111; color:#fff; border:2px solid #111; border-radius:10px 0 0 10px;
            font-size:13px; line-height:1.45; box-shadow:-6px 8px 24px rgba(0,0,0,.35) }
          .panel b{ color:#ffd400; letter-spacing:.12em } .panel a{ color:#ffd400 }
          .wrap.open .panel{ display:block }
          @media (max-width:560px){ .tab{ width:22px; padding:9px 0 } .tab span{ font-size:12px } }
        </style>
        <div class="wrap">
          <div class="panel" role="note" id="demo-note"><b>ДЕМО</b><br>Демо-версия сайта для цветочной мастерской «Натали». Сделано <a href="https://t.me/lilbunnych" target="_blank" rel="noopener">@lilbunnych</a>. Тексты и фото взяты со страницы мастерской, 3D-цветок сгенерирован в коде.</div>
          <button class="tab" aria-expanded="false" aria-controls="demo-note" aria-label="Демо-версия: подробнее"><span>DEMO</span></button>
        </div>`;
      const wrap = root.querySelector('.wrap'), tab = root.querySelector('.tab');
      tab.addEventListener('click', () => { const o = wrap.classList.toggle('open'); tab.setAttribute('aria-expanded', String(o)); });
      document.body.appendChild(host);
    })();
    </script>
    <!-- /DEMO BANNER -->
  </body>
</html>
